# Local run of the audit service with its dependencies: PostgreSQL 18, NATS with JetStream and audit itself.
#   docker compose up -d --build            everything; audit answers on http://localhost:8080
#   docker compose up -d postgres nats      only the dependencies, to run `npm start` on the host (see README)
# The identity provider is not part of this file: tokens are always verified, so audit fetches the signing keys from the
# one on the host (AUTH_JWKS_URL below, Keycloak on port 8081 as in the other services). The end to end script plays it
# instead (README, "Run it end to end").
# The passwords below are local development values only; real ones live in the Secret audit-env.
name: chance-audit

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: audit
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit # hooks:allow local development only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.15.2-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

  audit:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      APP_ENV: local
      PORT: "8080"
      DATABASE_URL: postgres://audit:audit@postgres:5432/audit # hooks:allow local development only
      NATS_URL: nats://nats:4222
      AUTH_JWKS_URL: http://host.docker.internal:8081/realms/chance/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  nats-data:
